# SPDX-License-Identifier: AGPL-3.0-or-later
#
# VLT CI. Each action is pinned to a full commit SHA. The version is in the
# comment. Shipped binaries are built with CGO_ENABLED=0.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"
  GOTOOLCHAIN: local
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the official file
  # gitleaks_8.30.1_checksums.txt of release v8.30.1.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GOVULNCHECK_VERSION: "v1.9.0"
  GO_LICENSES_VERSION: "v2.0.1"
  # SEC-061 allow list.
  ALLOWED_LICENSES: "MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,ISC,MPL-2.0"
  NODE_VERSION: "24"

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: go version
        run: go version
      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "Files that need gofmt:"; echo "$out"; exit 1
          fi
      - name: go vet
        run: |
          if [ -z "$(go list ./... 2>/dev/null)" ]; then echo "No Go packages yet."; exit 0; fi
          go vet ./...
      - name: go build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: go test (Windows)
        if: runner.os == 'Windows'
        run: |
          if [ -z "$(go list ./... 2>/dev/null)" ]; then echo "No Go packages yet."; exit 0; fi
          go test ./...
      - name: Windows DPAPI and ACL tests, verbose (VLT-IS-003 03-00-00-004 step 9.6)
        if: runner.os == 'Windows'
        run: go test -count=1 -v -run 'TestDPAPIRoundTrip|TestVaultWithDPAPI|TestCheckDataDirWindows' ./internal/vault ./internal/store
      - name: SEC-091 check (no test DEK provider in vltd)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          if grep -rl --include='*.go' --exclude='*_test.go' 'testOnly' . ; then
            echo "testOnly code in a non-test file"; exit 1
          fi
          GOOS=linux go build -o "$RUNNER_TEMP/vltd-linux" ./cmd/vltd
          GOOS=windows go build -o "$RUNNER_TEMP/vltd-windows.exe" ./cmd/vltd
          for b in "$RUNNER_TEMP/vltd-linux" "$RUNNER_TEMP/vltd-windows.exe"; do
            n="$(go tool nm "$b" | grep -c testOnly || true)"
            echo "$b: $n testOnly symbols"
            [ "$n" = 0 ]
          done
      - name: go test -race (Linux; the race detector needs cgo, test only)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: |
          if [ -z "$(go list ./... 2>/dev/null)" ]; then echo "No Go packages yet."; exit 0; fi
          go test -race ./...

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Fuzz smoke test (each fuzz target for 30 seconds)
        run: |
          set -euo pipefail
          found=0
          for pkg in $(go list ./...); do
            for f in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              found=1
              echo "::group::$pkg $f"
              go test -run='^$' -fuzz="^${f}\$" -fuzztime=30s "$pkg"
              echo "::endgroup::"
            done
          done
          if [ "$found" = 0 ]; then echo "No fuzz targets."; fi

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: govulncheck (Linux and Windows builds)
        run: |
          if [ -z "$(go list ./... 2>/dev/null)" ]; then echo "No Go packages yet."; exit 0; fi
          # Build the tool for the runner first. "GOOS=windows go run" builds a Windows binary.
          GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$RUNNER_TEMP/bin/govulncheck" ./...
          GOOS=windows "$RUNNER_TEMP/bin/govulncheck" ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download gitleaks and check SHA-256
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Confirm that the rules detect a Telegram bot token
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          # A fake token, made at run time, so that no token text is in the repository.
          tail="$(printf 'A%.0s' $(seq 1 35))"
          printf 'https://api.telegram.org/bot%s:%s/getMe\n' "$(printf '1%.0s' $(seq 1 10))" "$tail" > "$d/fake.txt"
          if "$RUNNER_TEMP/gitleaks" dir --no-banner -c .gitleaks.toml "$d"; then
            echo "The rules did not detect the fake Telegram bot token."; exit 1
          fi
      - name: Scan the full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact -v -c .gitleaks.toml --log-opts="--all" .
      - name: Repository path check (SEC-101)
        run: |
          set -euo pipefail
          # This step checks the tracked paths only, not the file content.
          # The pattern text in this file is not a path, so it does not match.
          if bad="$(git ls-files | grep -E '(^|/)ANALIZ/|\.(gpr|rep|gzf)$')"; then
            echo "SEC-101: the repository contains a path that is not permitted:"
            echo "$bad"
            exit 1
          fi
          echo "SEC-101: no path that is not permitted."
      - name: Reference document is unchanged (VLT-IS-006 03-00-00-002)
        run: |
          echo "4ee716bc84db6752a8385d89c33bae9a83f3e313bec5ff4b8adad39442eeef8e  docs/reference/VLT-REF-001.md" | sha256sum -c -

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: go-licenses check (SEC-061 allow list)
        run: |
          set -euo pipefail
          # Build the tool for the runner first. "GOOS=windows go run" builds a Windows binary.
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"
          for os in linux windows; do
            echo "GOOS=$os"
            GOOS=$os "$RUNNER_TEMP/bin/go-licenses" report ./... \
              --ignore github.com/abuzer1495/voltiovolt
            GOOS=$os "$RUNNER_TEMP/bin/go-licenses" check ./... \
              --allowed_licenses="${ALLOWED_LICENSES}" \
              --ignore github.com/abuzer1495/voltiovolt
          done

  artifacts:
    name: artifacts
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build vlt-probe (CGO_ENABLED=0) with SHA-256 files
        if: hashFiles('cmd/vlt-probe/main.go') != ''
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/vlt-probe-linux-amd64 ./cmd/vlt-probe
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/vlt-probe-windows-amd64.exe ./cmd/vlt-probe
          cd dist
          for f in vlt-probe-linux-amd64 vlt-probe-windows-amd64.exe; do
            sha256sum "$f" > "$f.sha256"
          done
          cat ./*.sha256
      - name: No vlt-probe yet
        if: hashFiles('cmd/vlt-probe/main.go') == ''
        run: echo "cmd/vlt-probe does not exist yet. No artifact."
      - name: Upload vlt-probe linux-amd64 (not a release)
        if: hashFiles('cmd/vlt-probe/main.go') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vlt-probe-linux-amd64
          path: |
            dist/vlt-probe-linux-amd64
            dist/vlt-probe-linux-amd64.sha256
          retention-days: 14
          if-no-files-found: error
      - name: Upload vlt-probe windows-amd64 (not a release)
        if: hashFiles('cmd/vlt-probe/main.go') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vlt-probe-windows-amd64
          path: |
            dist/vlt-probe-windows-amd64.exe
            dist/vlt-probe-windows-amd64.exe.sha256
          retention-days: 14
          if-no-files-found: error
      - name: Build vltd and vlt-setup (CGO_ENABLED=0) with SHA-256 files (VLT-IS-004 03-00-00-002 step 5)
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist/windows dist/linux
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/windows/vltd.exe ./cmd/vltd
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/windows/vlt-setup.exe ./cmd/vlt-setup
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/linux/vltd ./cmd/vltd
          (cd dist/windows && for f in vltd.exe vlt-setup.exe; do sha256sum "$f" > "$f.sha256"; done && cat ./*.sha256)
          (cd dist/linux && sha256sum vltd > vltd.sha256 && cat vltd.sha256)
      - name: Upload vltd and vlt-setup windows-amd64 (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vltd-vlt-setup-windows-amd64
          path: |
            dist/windows/vltd.exe
            dist/windows/vltd.exe.sha256
            dist/windows/vlt-setup.exe
            dist/windows/vlt-setup.exe.sha256
          retention-days: 14
          if-no-files-found: error
      - name: Upload vltd linux-amd64 (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vltd-linux-amd64
          path: |
            dist/linux/vltd
            dist/linux/vltd.sha256
          retention-days: 14
          if-no-files-found: error

  # VLT GUI (VLT-IS-005 TASK 03-00-00-002 step 5). cmd/vlt-gui is a separate
  # Go module with Wails v3. CGO_ENABLED=1 only in gui-linux (OD-03).
  gui-linux:
    name: gui-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: WebKitGTK and GTK packages for Wails v3.1.0 (GTK 4, WebKitGTK 6.0)
        # Source: wails v3.1.0 pkg/application/linux_cgo.go ("#cgo linux
        # pkg-config: gtk4 webkitgtk-6.0"), internal/assetserver/webview/
        # webkit_linux.go (libsoup-3.0, gio-unix-2.0),
        # pkg/application/global_shortcut_linux_x11.go (x11) and
        # internal/doctor/packagemanager/apt.go (package names).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libx11-dev
          pkg-config --modversion gtk4 webkitgtk-6.0 libsoup-3.0 x11
      - name: npm ci (no install scripts)
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Build the front end
        working-directory: web
        run: npm run build
      - name: Front-end tests (CSP, i18n, components)
        working-directory: web
        run: npm test
      - name: npm audit (high and critical)
        working-directory: web
        run: npm audit --audit-level=high
      - name: npm license check (SEC-061 allow list)
        working-directory: web
        run: npm run licenses
      - name: go vet, test and build vlt-gui (CGO_ENABLED=1)
        working-directory: cmd/vlt-gui
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go vet -tags production .
          go test -tags production .
          mkdir -p dist
          go build -tags production -trimpath -ldflags "-X github.com/abuzer1495/voltiovolt/internal/gui.Version=ci-${GITHUB_SHA::12}" -o dist/vlt-gui-linux-amd64 .
          (cd dist && sha256sum vlt-gui-linux-amd64 > vlt-gui-linux-amd64.sha256 && cat vlt-gui-linux-amd64.sha256)
      - name: go-licenses and govulncheck of vlt-gui
        working-directory: cmd/vlt-gui
        env:
          CGO_ENABLED: "1"
          GOFLAGS: "-tags=production"
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"
          GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$RUNNER_TEMP/bin/go-licenses" report . --ignore github.com/abuzer1495/voltiovolt
          "$RUNNER_TEMP/bin/go-licenses" check . --allowed_licenses="${ALLOWED_LICENSES}" --ignore github.com/abuzer1495/voltiovolt
          "$RUNNER_TEMP/bin/govulncheck" ./...
      - name: Upload vlt-gui linux-amd64 (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vlt-gui-linux-amd64
          path: |
            cmd/vlt-gui/dist/vlt-gui-linux-amd64
            cmd/vlt-gui/dist/vlt-gui-linux-amd64.sha256
          retention-days: 14
          if-no-files-found: error

  gui-windows:
    name: gui-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm ci (no install scripts)
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Build the front end
        working-directory: web
        run: npm run build
      - name: Front-end tests (CSP, i18n, components)
        working-directory: web
        run: npm test
      - name: npm audit (high and critical)
        working-directory: web
        run: npm audit --audit-level=high
      - name: npm license check (SEC-061 allow list)
        working-directory: web
        run: npm run licenses
      - name: go vet, test and build vlt-gui (CGO_ENABLED=0)
        working-directory: cmd/vlt-gui
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go vet -tags production .
          go test -tags production .
          mkdir -p dist
          go build -tags production -trimpath -ldflags "-H windowsgui -X github.com/abuzer1495/voltiovolt/internal/gui.Version=ci-${GITHUB_SHA::12}" -o dist/vlt-gui-windows-amd64.exe .
          (cd dist && sha256sum vlt-gui-windows-amd64.exe > vlt-gui-windows-amd64.exe.sha256 && cat vlt-gui-windows-amd64.exe.sha256)
      - name: go-licenses and govulncheck of vlt-gui
        working-directory: cmd/vlt-gui
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-tags=production"
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"
          GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$RUNNER_TEMP/bin/go-licenses" report . --ignore github.com/abuzer1495/voltiovolt
          "$RUNNER_TEMP/bin/go-licenses" check . --allowed_licenses="${ALLOWED_LICENSES}" --ignore github.com/abuzer1495/voltiovolt
          "$RUNNER_TEMP/bin/govulncheck" ./...
      - name: Upload vlt-gui windows-amd64 (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vlt-gui-windows-amd64
          path: |
            cmd/vlt-gui/dist/vlt-gui-windows-amd64.exe
            cmd/vlt-gui/dist/vlt-gui-windows-amd64.exe.sha256
          retention-days: 14
          if-no-files-found: error
