# SPDX-License-Identifier: AGPL-3.0-or-later
#
# CI screenshots of the VoltioVolt GUI in Demo mode (VLT-IS-009 / t7u).
# The PNGs are uploaded as the artifact screenshots.zip. They are never
# committed (SEC-087).
#
# Extra tools, only on the runner (SEC-061 allow list):
#   - scrot: MIT
#   - xdotool: BSD-3-Clause
#   - Xvfb / X.Org: MIT
# ImageMagick is not used (its license is not on the SEC-061 list).
# Windows capture uses in-box PowerShell and System.Drawing.

name: screenshots

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"
  GOTOOLCHAIN: local
  NODE_VERSION: "24"

jobs:
  screenshots-linux:
    name: screenshots-linux
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install WebKitGTK, Xvfb, xdotool and scrot
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libx11-dev \
            xvfb xdotool scrot dbus-x11 fonts-dejavu-core adwaita-icon-theme
          pkg-config --modversion gtk4 webkitgtk-6.0
          scrot -v
          command -v xdotool
      - name: Build the front end
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build VoltioVolt test binary (no production tag)
        working-directory: cmd/voltiovolt
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go test -count=1 .
          go build -trimpath -ldflags "-X main.version=ci-shot-${GITHUB_SHA::12}" -o "$RUNNER_TEMP/voltiovolt" .
      - name: Capture screenshots under Xvfb
        env:
          BIN: ${{ runner.temp }}/voltiovolt
          OUT: ${{ runner.temp }}/shots
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          export GDK_BACKEND=x11
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" -a \
            ./scripts/screenshots-linux.sh
          test -n "$(ls -A "$OUT"/*.png)"
      - name: Upload linux PNGs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-linux
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 14
          if-no-files-found: error

  screenshots-windows:
    name: screenshots-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build the front end
        working-directory: web
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build VoltioVolt test binary (no production tag)
        working-directory: cmd/voltiovolt
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go test -count=1 .
          go build -trimpath -ldflags "-X main.version=ci-shot-${GITHUB_SHA::12}" -o "$RUNNER_TEMP/VoltioVolt.exe" .
      - name: Capture screenshots
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "shots"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bin = Join-Path $env:RUNNER_TEMP "VoltioVolt.exe"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/screenshots-windows.ps1 -Bin $bin -Out $out
          if (-not (Get-ChildItem $out -Filter *.png)) { throw "no screenshots" }
      - name: Upload windows PNGs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-windows
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 14
          if-no-files-found: error

  pack:
    name: pack screenshots.zip
    needs: [screenshots-linux, screenshots-windows]
    if: always() && (needs.screenshots-linux.result == 'success' || needs.screenshots-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: shots
          merge-multiple: false
        continue-on-error: true
      - name: Build screenshots.zip
        run: |
          set -euo pipefail
          mkdir -p packed
          if [ -d shots/screenshots-linux ]; then
            mkdir -p packed/linux
            cp -a shots/screenshots-linux/*.png packed/linux/ || true
          fi
          if [ -d shots/screenshots-windows ]; then
            mkdir -p packed/windows
            cp -a shots/screenshots-windows/*.png packed/windows/ || true
          fi
          find packed -type f -name '*.png' | tee file-list.txt
          test -s file-list.txt
          (cd packed && zip -r ../screenshots.zip .)
          ls -l screenshots.zip
      - name: Upload screenshots.zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots.zip
          retention-days: 14
          if-no-files-found: error
