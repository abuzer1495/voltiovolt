# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Test build (VLT-IS-007 TASK 03-00-00-001, VLT-IS-008 TASK 03-00-00-006,
# OD-30, OD-31). For each push to main (and a manual start), GitHub Actions
# builds the portable test packages and replaces the pre-release
# "test-latest". Each action is pinned to a full commit SHA. The version is
# in the comment.
#
# Only the job "release" has write permission (contents: write). It runs
# only on main, after both build jobs pass. The fixed tag test-latest is the
# exception to SEC-067 (OD-31). The builds also run for pull requests, but
# the release job does not.
#
# The default packages have VoltioVolt and vlt-probe only (SEC-102). The
# service binaries vltd, vlt-gui and vlt-setup stay in the source and in
# the CI of ci.yml. They are not in these packages.

name: test-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.4"
  GOTOOLCHAIN: local
  NODE_VERSION: "24"

jobs:
  windows:
    name: test-build-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Version text
        run: echo "VLT_VERSION=0.0.0-test+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build the front end
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build VoltioVolt.exe and vlt-probe.exe (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/VoltioVolt-test-windows-amd64"
          mkdir -p "$out"
          (cd cmd/voltiovolt && go build -tags production -trimpath -ldflags "-H windowsgui -X main.version=${VLT_VERSION} -X github.com/abuzer1495/voltiovolt/internal/gui.Version=${VLT_VERSION}" -o "$out/VoltioVolt.exe" .)
          go build -trimpath -ldflags "-X main.toolVersion=${VLT_VERSION}" -o "$out/vlt-probe.exe" ./cmd/vlt-probe
          cp packaging/test/windows/install.cmd packaging/test/windows/uninstall.cmd packaging/test/windows/remove-old-test-service.cmd packaging/test/windows/OKUBENI-README.txt "$out/"
          ls -l "$out"
      - name: Check the install scripts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/VoltioVolt-test-windows-amd64"
          for f in install.cmd uninstall.cmd; do
            if grep -Eiq 'runas|sc |net localgroup|reg add|icacls' "$out/$f"; then
              echo "ERROR: $f contains a forbidden command (runas, sc, net localgroup, reg add or icacls)." >&2
              grep -Ein 'runas|sc |net localgroup|reg add|icacls' "$out/$f" >&2 || true
              exit 1
            fi
          done
          echo "script check ok"
      - name: Start test of VoltioVolt.exe with the simulator
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/VoltioVolt-test-windows-amd64"
          dir="$RUNNER_TEMP/vv-self-test"
          mkdir -p "$dir"
          "$out/VoltioVolt.exe" --self-test --data-dir "$dir"
          test -f "$dir/self-test-result.txt"
          grep -q '^ok ' "$dir/self-test-result.txt"
          cat "$dir/self-test-result.txt"

      - name: Build vlt-simulator for the end-to-end test (VLT-IS-010 005)
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/vlt-simulator.exe" ./cmd/vlt-simulator

      - name: End-to-end test connection, megatec and scenario 1 (VLT-IS-010 005)
        run: |
          set -euo pipefail
          sim="$RUNNER_TEMP/vlt-simulator.exe"
          vv="$RUNNER_TEMP/VoltioVolt-test-windows-amd64/VoltioVolt.exe"
          dir="$RUNNER_TEMP/vv-e2e-megatec"
          mkdir -p "$dir"
          "$sim" --headless --lang en --dialect megatec --scenario 1 --scenario-delay 20s &
          sim_pid=$!
          cleanup() { kill "$sim_pid" 2>/dev/null || true; wait "$sim_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 2
          "$vv" --self-test --test-connection --data-dir "$dir" --expect-dialect megatec --expect-event ON_BATTERY
          test -f "$dir/self-test-connection-result.txt"
          grep -q 'dialect=megatec' "$dir/self-test-connection-result.txt"
          grep -q 'input=230.0' "$dir/self-test-connection-result.txt"
          grep -q 'event=ON_BATTERY' "$dir/self-test-connection-result.txt"
          grep -q 'shutdown=dry' "$dir/self-test-connection-result.txt"
          cat "$dir/self-test-connection-result.txt"

      - name: End-to-end test connection, voltronic dialect (VLT-IS-010 005)
        run: |
          set -euo pipefail
          sim="$RUNNER_TEMP/vlt-simulator.exe"
          vv="$RUNNER_TEMP/VoltioVolt-test-windows-amd64/VoltioVolt.exe"
          dir="$RUNNER_TEMP/vv-e2e-voltronic"
          mkdir -p "$dir"
          "$sim" --headless --lang en --dialect voltronic &
          sim_pid=$!
          cleanup() { kill "$sim_pid" 2>/dev/null || true; wait "$sim_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 2
          "$vv" --self-test --test-connection --data-dir "$dir" --expect-dialect voltronic
          test -f "$dir/self-test-connection-result.txt"
          grep -q 'dialect=voltronic' "$dir/self-test-connection-result.txt"
          grep -q 'input=230.0' "$dir/self-test-connection-result.txt"
          grep -q 'shutdown=dry' "$dir/self-test-connection-result.txt"
          cat "$dir/self-test-connection-result.txt"

      - name: Make the zip file
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'VoltioVolt-test-windows-amd64'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $out -DestinationPath dist/VoltioVolt-test-windows-amd64.zip
          Get-FileHash dist/VoltioVolt-test-windows-amd64.zip -Algorithm SHA256
      - name: Extract the zip and check the file list
        run: |
          set -euo pipefail
          python - <<PY
          import os, pathlib, sys, zipfile
          zpath = pathlib.Path("dist") / "VoltioVolt-test-windows-amd64.zip"
          want = {
              "VoltioVolt.exe",
              "vlt-probe.exe",
              "install.cmd",
              "uninstall.cmd",
              "remove-old-test-service.cmd",
              "OKUBENI-README.txt",
          }
          with zipfile.ZipFile(zpath) as z:
              names = [n for n in z.namelist() if not n.endswith("/")]
          bases = {pathlib.Path(n).name for n in names}
          if bases != want or len(names) != 6:
              print("files", names, "bases", sorted(bases), file=sys.stderr)
              sys.exit(1)
          print("zip file list ok:", ", ".join(sorted(bases)))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-build-windows
          path: dist/VoltioVolt-test-windows-amd64.zip
          retention-days: 14
          if-no-files-found: error

  linux:
    name: test-build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Version text
        run: echo "VLT_VERSION=0.0.0-test+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: GTK 4 and WebKitGTK 6.0 packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libx11-dev
      - name: Build the front end
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build voltiovolt (CGO_ENABLED=1) and vlt-probe (CGO_ENABLED=0)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/VoltioVolt-test-linux-amd64"
          mkdir -p "$out"
          (cd cmd/voltiovolt && CGO_ENABLED=1 go build -tags production -trimpath -ldflags "-X main.version=${VLT_VERSION} -X github.com/abuzer1495/voltiovolt/internal/gui.Version=${VLT_VERSION}" -o "$out/voltiovolt" .)
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.toolVersion=${VLT_VERSION}" -o "$out/vlt-probe" ./cmd/vlt-probe
          install -m 0755 packaging/test/linux/install.sh packaging/test/linux/uninstall.sh "$out/"
          cp packaging/test/linux/OKUBENI-README.txt "$out/"
          "$out/vlt-probe" version | grep -F "$VLT_VERSION"
          sh -n "$out/install.sh"
          sh -n "$out/uninstall.sh"
          python3 - <<PY
          import os, pathlib, sys
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "VoltioVolt-test-linux-amd64"
          want = {"voltiovolt", "vlt-probe", "install.sh", "uninstall.sh", "OKUBENI-README.txt"}
          names = {p.name for p in out.iterdir() if p.is_file()}
          if names != want:
              print("files", sorted(names), "want", sorted(want), file=sys.stderr)
              sys.exit(1)
          print("file list ok:", ", ".join(sorted(names)))
          PY
          mkdir -p dist
          tar -C "$RUNNER_TEMP" --owner=0 --group=0 -czf dist/VoltioVolt-test-linux-amd64.tar.gz VoltioVolt-test-linux-amd64
          tar -tzvf dist/VoltioVolt-test-linux-amd64.tar.gz
          sha256sum dist/VoltioVolt-test-linux-amd64.tar.gz

      - name: Build vlt-simulator for the end-to-end test (VLT-IS-010 005)
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/vlt-simulator" ./cmd/vlt-simulator

      - name: End-to-end test connection, megatec and scenario 1 (VLT-IS-010 005)
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-e2e-megatec"
          mkdir -p "$XDG_RUNTIME_DIR"
          sim="$RUNNER_TEMP/vlt-simulator"
          vv="$RUNNER_TEMP/VoltioVolt-test-linux-amd64/voltiovolt"
          dir="$RUNNER_TEMP/vv-e2e-megatec"
          mkdir -p "$dir"
          "$sim" --headless --lang en --dialect megatec --scenario 1 --scenario-delay 20s &
          sim_pid=$!
          cleanup() { kill "$sim_pid" 2>/dev/null || true; wait "$sim_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 2
          "$vv" --self-test --test-connection --data-dir "$dir" --expect-dialect megatec --expect-event ON_BATTERY
          test -f "$dir/self-test-connection-result.txt"
          grep -q 'dialect=megatec' "$dir/self-test-connection-result.txt"
          grep -q 'input=230.0' "$dir/self-test-connection-result.txt"
          grep -q 'event=ON_BATTERY' "$dir/self-test-connection-result.txt"
          grep -q 'shutdown=dry' "$dir/self-test-connection-result.txt"
          cat "$dir/self-test-connection-result.txt"

      - name: End-to-end test connection, voltronic dialect (VLT-IS-010 005)
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-e2e-voltronic"
          mkdir -p "$XDG_RUNTIME_DIR"
          sim="$RUNNER_TEMP/vlt-simulator"
          vv="$RUNNER_TEMP/VoltioVolt-test-linux-amd64/voltiovolt"
          dir="$RUNNER_TEMP/vv-e2e-voltronic"
          mkdir -p "$dir"
          "$sim" --headless --lang en --dialect voltronic &
          sim_pid=$!
          cleanup() { kill "$sim_pid" 2>/dev/null || true; wait "$sim_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 2
          "$vv" --self-test --test-connection --data-dir "$dir" --expect-dialect voltronic
          test -f "$dir/self-test-connection-result.txt"
          grep -q 'dialect=voltronic' "$dir/self-test-connection-result.txt"
          grep -q 'input=230.0' "$dir/self-test-connection-result.txt"
          grep -q 'shutdown=dry' "$dir/self-test-connection-result.txt"
          cat "$dir/self-test-connection-result.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-build-linux
          path: dist/VoltioVolt-test-linux-amd64.tar.gz
          retention-days: 14
          if-no-files-found: error

  release:
    name: test-build-release
    needs: [windows, linux]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: test-build-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-build-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS.txt
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum VoltioVolt-test-windows-amd64.zip VoltioVolt-test-linux-amd64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Replace the pre-release test-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          gh release delete test-latest --cleanup-tag --yes || echo "no old release test-latest"
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/test-latest" 2>/dev/null || echo "no old tag test-latest"
          {
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "Test build. Not for normal use."
            echo
            echo "Owner tests: https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/docs/user/owner-tests.md"
          } > "$RUNNER_TEMP/notes.md"
          gh release create test-latest \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Test build $(date -u +%Y-%m-%d) ${short}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/VoltioVolt-test-windows-amd64.zip \
            dist/VoltioVolt-test-linux-amd64.tar.gz \
            dist/SHA256SUMS.txt
          gh release view test-latest --json url,tagName,isPrerelease,assets --jq '{url,tagName,isPrerelease,assets:[.assets[].name]}'
