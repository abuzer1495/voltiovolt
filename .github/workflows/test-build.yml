# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Test build (VLT-IS-007 TASK 03-00-00-001, OD-30, OD-31). For each push to
# main (and a manual start), GitHub Actions builds the test packages and
# replaces the pre-release "test-latest". Each action is pinned to a full
# commit SHA. The version is in the comment.
#
# Only the job "release" has write permission (contents: write). It runs
# only on main, after both build jobs pass. The fixed tag test-latest is the
# exception to SEC-067 (OD-31). The builds also run for pull requests, but
# the release job does not.

name: test-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.3"
  GOTOOLCHAIN: local
  NODE_VERSION: "24"

jobs:
  windows:
    name: test-build-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Version text
        run: echo "VLT_VERSION=0.0.0-test+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build the front end
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build vltd, vlt-setup, vlt-probe and vlt-gui (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/VoltioVolt-test-windows-amd64"
          mkdir -p "$out"
          go build -trimpath -ldflags "-X main.version=${VLT_VERSION}" -o "$out/vltd.exe" ./cmd/vltd
          go build -trimpath -ldflags "-X main.version=${VLT_VERSION}" -o "$out/vlt-setup.exe" ./cmd/vlt-setup
          go build -trimpath -ldflags "-X main.toolVersion=${VLT_VERSION}" -o "$out/vlt-probe.exe" ./cmd/vlt-probe
          (cd cmd/vlt-gui && go build -tags production -trimpath -ldflags "-H windowsgui -X github.com/abuzer1495/voltiovolt/internal/gui.Version=${VLT_VERSION}" -o "$out/vlt-gui.exe" .)
          cp packaging/test/windows/install-test.cmd packaging/test/windows/uninstall-test.cmd packaging/test/windows/OKUBENI-README.txt "$out/"
          "$out/vltd.exe" --version
          "$out/vlt-setup.exe" version
          "$out/vlt-probe.exe" version
          "$out/vltd.exe" --version | grep -F "$VLT_VERSION"
          ls -l "$out"
      - name: Make the zip file
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'VoltioVolt-test-windows-amd64'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $out -DestinationPath dist/VoltioVolt-test-windows-amd64.zip
          Get-FileHash dist/VoltioVolt-test-windows-amd64.zip -Algorithm SHA256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-build-windows
          path: dist/VoltioVolt-test-windows-amd64.zip
          retention-days: 14
          if-no-files-found: error

  linux:
    name: test-build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Version text
        run: echo "VLT_VERSION=0.0.0-test+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: GTK 4 and WebKitGTK 6.0 packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libx11-dev
      - name: Build the front end
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build vltd and vlt-probe (CGO_ENABLED=0), vlt-gui (CGO_ENABLED=1)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/VoltioVolt-test-linux-amd64"
          mkdir -p "$out/packaging/linux"
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=${VLT_VERSION}" -o "$out/vltd" ./cmd/vltd
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.toolVersion=${VLT_VERSION}" -o "$out/vlt-probe" ./cmd/vlt-probe
          (cd cmd/vlt-gui && CGO_ENABLED=1 go build -tags production -trimpath -ldflags "-X github.com/abuzer1495/voltiovolt/internal/gui.Version=${VLT_VERSION}" -o "$out/vlt-gui" .)
          cp packaging/linux/* "$out/packaging/linux/"
          install -m 0755 packaging/test/linux/install-test.sh packaging/test/linux/uninstall-test.sh "$out/"
          cp packaging/test/linux/OKUBENI-README.txt "$out/"
          "$out/vltd" --version | grep -F "$VLT_VERSION"
          "$out/vlt-probe" version | grep -F "$VLT_VERSION"
          sh -n "$out/install-test.sh"
          sh -n "$out/uninstall-test.sh"
          mkdir -p dist
          tar -C "$RUNNER_TEMP" --owner=0 --group=0 -czf dist/VoltioVolt-test-linux-amd64.tar.gz VoltioVolt-test-linux-amd64
          tar -tzvf dist/VoltioVolt-test-linux-amd64.tar.gz
          sha256sum dist/VoltioVolt-test-linux-amd64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-build-linux
          path: dist/VoltioVolt-test-linux-amd64.tar.gz
          retention-days: 14
          if-no-files-found: error

  release:
    name: test-build-release
    needs: [windows, linux]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: test-build-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-build-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS.txt
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum VoltioVolt-test-windows-amd64.zip VoltioVolt-test-linux-amd64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Replace the pre-release test-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          gh release delete test-latest --cleanup-tag --yes || echo "no old release test-latest"
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/test-latest" 2>/dev/null || echo "no old tag test-latest"
          {
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "Test build. Not for normal use."
            echo
            echo "Owner tests: https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/docs/user/owner-tests.md"
          } > "$RUNNER_TEMP/notes.md"
          gh release create test-latest \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Test build $(date -u +%Y-%m-%d) ${short}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/VoltioVolt-test-windows-amd64.zip \
            dist/VoltioVolt-test-linux-amd64.tar.gz \
            dist/SHA256SUMS.txt
          gh release view test-latest --json url,tagName,isPrerelease,assets --jq '{url,tagName,isPrerelease,assets:[.assets[].name]}'
